name: Evolution auto-commit

on:
  push:
    branches:
      - "**"

concurrency:
  group: evolution-update-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-branch:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate and push evolution records
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH_NAME" "$DEFAULT_BRANCH"
            git reset --hard "origin/$BRANCH_NAME"
            source_commits=$(git rev-list --reverse "origin/$DEFAULT_BRANCH..HEAD")
            generated=false
            for source_sha in $source_commits; do
              python tools/evolution.py generate --commit "$source_sha"
              if ! git diff --quiet -- PROJECT_EVOLUTION.md evolution/commits; then
                git add PROJECT_EVOLUTION.md evolution/commits
                git commit -m "docs(evolution): record $source_sha" -m "Evolution-Auto: true"
                generated=true
              fi
            done

            if [ "$generated" = false ]; then
              echo "No evolution commit required."
              validated_sha=$(git rev-parse HEAD)
              python tools/evolution.py validate --range "origin/$DEFAULT_BRANCH..$validated_sha"
              gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$validated_sha" \
                -f state=success \
                -f context="Repository evolution" \
                -f description="Evolution trailers and generated records are current"
              exit 0
            fi

            if git push origin "HEAD:$BRANCH_NAME"; then
              documented_sha=$(git rev-parse HEAD)
              python tools/evolution.py validate --range "origin/$DEFAULT_BRANCH..$documented_sha"
              gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$documented_sha" \
                -f state=success \
                -f context="Repository evolution" \
                -f description="Evolution trailers and generated records are current"
              exit 0
            fi
            echo "Concurrent update detected; retrying ($attempt/3)." >&2
          done

          echo "Unable to push the generated evolution commit after 3 attempts." >&2
          exit 1

  audit-default:
    if: github.ref_name == github.event.repository.default_branch
    name: Repository evolution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate pushed commits and current document
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            python tools/evolution.py validate --document-only
          else
            python tools/evolution.py validate --range "$BEFORE_SHA..HEAD"
          fi

