name: Architecture contract

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate raw architecture
        run: |
          python -m json.tool .architecture/technical.json >/dev/null
          python -m json.tool .architecture/commercial.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('.architecture/technical.json').read_text()); c=json.loads(Path('.architecture/commercial.json').read_text())
          assert t.get('schema_version')==1 and t.get('kind')=='technical-architecture'
          assert c.get('schema_version')==1 and c.get('kind')=='commercial-architecture'
          assert t['repository']['full_name']==c['repository']['full_name']
          PY
      - name: Determine changed files
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "${GITHUB_BASE_REF:-}" ]; then git fetch --no-tags origin "$GITHUB_BASE_REF"; BASE="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"; git diff --name-only "$BASE" HEAD > /tmp/architecture-changed-files.txt
          elif git rev-parse HEAD^ >/dev/null 2>&1; then git diff --name-only HEAD^ HEAD > /tmp/architecture-changed-files.txt
          else git show --pretty="" --name-only HEAD > /tmp/architecture-changed-files.txt; fi
      - name: Enforce architecture impact contract
        run: |
          python - <<'PY'
          import fnmatch,json
          from pathlib import Path
          changed=[p.strip() for p in Path('/tmp/architecture-changed-files.txt').read_text().splitlines() if p.strip()]; t=json.loads(Path('.architecture/technical.json').read_text()); patterns=t.get('impact_rules',{}).get('paths',[]); raw={'.architecture/technical.json','.architecture/commercial.json'}; generated={'TECHNICAL_ARCHITECTURE.md','COMMERCIAL_ARCHITECTURE.md','.architecture/generate.py'}; governance={'.github/workflows/architecture-contract.yml','.github/workflows/cross-platform.yml','.github/workflows/repository-evolution.yml','.github/workflows/evolution-autocommit.yml','.project/ci-status.json'}
          def relevant(p):
            if p in raw or p in generated or p in governance:return False
            if p.startswith('.github/workflows/'):return any(x in p.lower() for x in ('deploy','release','publish','infra'))
            return any(fnmatch.fnmatch(p,x) for x in patterns)
          impacted=[p for p in changed if relevant(p)]
          if impacted and not raw.intersection(changed):raise SystemExit('Architecture impact without raw architecture update: '+', '.join(impacted))
          PY
      - name: Regenerate architecture schemas
        run: python .architecture/generate.py
      - name: Require generated schemas committed
        run: git diff --exit-code -- TECHNICAL_ARCHITECTURE.md COMMERCIAL_ARCHITECTURE.md
      - name: Publish architecture state
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          t=json.loads(Path('.architecture/technical.json').read_text()).get('architecture',{}).get('status','UNKNOWN'); c=json.loads(Path('.architecture/commercial.json').read_text()).get('commercial_architecture',{}).get('status','UNKNOWN'); state='TODO' if t in {'BASELINE','UNKNOWN'} or c in {'UNASSESSED','UNKNOWN'} else 'VERIFIED'; print(f'# Architecture contract\n- State: **{state}**\n- Technical model: **{t}**\n- Commercial model: **{c}**\n- `FAILED` is reserved for a real contract violation.')
          PY
