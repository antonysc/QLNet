name: Repository evolution

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository evolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate pull request commits
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/evolution.py validate --range "$BASE_SHA..HEAD"
      - name: Explain fork requirement
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          echo "Fork pull requests must generate their evolution record locally." >&2
          echo "Run exactly: python tools/evolution.py generate --commit HEAD" >&2
          python tools/evolution.py validate --range "${{ github.event.pull_request.base.sha }}..HEAD"
      - name: Validate merge queue
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python tools/evolution.py validate --range "$BASE_SHA..HEAD"
      - name: Validate current document
        if: github.event_name == 'workflow_dispatch'
        run: python tools/evolution.py validate --document-only

